		<link rel="stylesheet" href="css/main.css">
		<script type="module" src="js/main.ts"></script>
	</head>
	<body>
		<a href="#top">
			<button><block name="back-to-top"></block></button>
		</a>
		<header>
			<nav class="container-fluid mobile">
				<ul>
					<li class="centerText title">
						<block name="logo">
						</block>
					</li>
				</ul>
				<ul class="mobileCenter">
					<li><a href="#about">
						<block name="nav-about"></block>
					</a></li>
					<li><a href="#install">
						<block name="nav-install"></block>
					</a></li>
					<li><a href="#usage">
						<block name="nav-usage"></block>
					</a></li>
					<li>
						<!-- TODO: This will lead to github.io docs site. -->
						<details class="dropdown">
							<summary>Français</summary><ul><li><a href="https://NicholasDJM.github.io/Helldivers 2 Stratagem Macros/en-CA.html">English</a></li><li><a href="https://NicholasDJM.github.io/Helldivers 2 Stratagem Macros/fr-CA.html">Français</a></li></ul>
						</details>
					</li>
				</ul>
			</nav>
		</header>
		<main class="container-fluid">
			<article id="about">
				<section>
					<h1><block name="about-title"></block></h1>
					<div class="grid">
						<div style="display:none !important">
							<!-- TODO: Create video introducing the program. -->
							<video controls controlslist="nodownload">
								<source src="./videos/fr-CA/about.dark.webm" type="video/webm" media="(prefers-color-scheme: dark)">
								<source src="./videos/fr-CA/about.light.webm" type="video/webm">
							</video>
						</div>
						<div>
							<block name="about"></block>
						</div>
					</div>
				</section>
			</article>
			<article id="install">
				<section>
					<h2><block name="install-title"></block></h2>
					<block name="install">
					</block>
				</section>
				<section>
					<h3><block name="syntax-title"></block></h3>
					<block name="syntax">
					</block>
				</section>
				<section>
					<h3><block name="syntax-examples-title"></block></h3>
					<block name="syntax-examples"></block>
				</section>
			</article>
			<article id="usage">
				<section>
					<h2><block name="usage-title"></block></h2>
					<details id="deck-howto">
							<summary><block name="usage-deck-title"></block></summary>
							<div class="grid">
								<div>
									<block name="usage-deck">
									</block>
								</div>
								<div class="center">
									<img alt="undefined"
										height="299px" width="569px" src="images/fr-CA/ExampleUsageWithStreamDeck.webp"
									/>
								</div>
							</div>
					</details>
					<hr>
					<details id="ahk-howto">
						<summary><block name="usage-ahk-title"></block></summary>
						<div class="grid">
							<div>
								<block name="usage-ahk">
								</block>
							</div>
							<div>
								<h3><block name="usage-ahk-example-title"></block></h3>
								<pre><code id="ahkExample" class="language-autohotkey" data-filename="example.ahk" data-mime="application/ahk" dir="ltr"
									><include src="example.ahk"></include></code></pre>
								<div class="justifyEnd">
									<a href='data:application/autohotkey;base64,I1JlcXVpcmVzIEF1dG9Ib3RrZXkgPj0yLjANClNlbmRNb2RlICJFdmVudCINClNldFdvcmtpbmdEaXIgQV9TY3JpcHREaXINCm1hY3JvKHN0cmF0YWdlbSkgew0KCWlmIChXaW5BY3RpdmUoIkhFTExESVZFUlPihKIgMiIpKSB7DQoJCXRyeSB7DQoJCQlSdW4oJyJIZWxsZGl2ZXJzIDIgTWFjcm9zLmFoayIgIicgLiBzdHJhdGFnZW0gLiAnIicpDQoJCX0gY2F0Y2ggew0KCQkJVHJheVRpcCgiQ291bGQgbm90IHJ1biBIZWxsZGl2ZXJzIDIgTWFjcm9zIHNjcmlwdC4iKQ0KCQl9DQoJfQ0KfQ0KWEJ1dHRvbjE6OiB7IDsgTW91c2UgQnJvd3NlciBCYWNrIGJ1dHRvbg0KCW1hY3JvKCJyZWNvaWxsZXNzIHJpZmxlIikNCn0NClhCdXR0b24yOjogeyA7IE1vdXNlIEJyb3dzZXIgRm9yd2FyZCBidXR0b24NCgltYWNybygicGF0cmlvdCBleG9zdWl0IikNCn0NCkg6OiB7DQoJbWFjcm8oImhlbGxib21iIikNCn0='><button>
										<block name="usage-ahk-example-download"></block>
									</button></a>
									<button x-cloak @click="copy" x-data="tools"><block name="usage-ahk-example-copy"></block></button>
								</div>
							</div>
						</div>
					</details>
					<hr>
					<details id="audio-howto">
						<summary><block name="usage-audio-title"></block></summary>
						<div class="grid">
							<div>
								<block name="usage-audio">
								</block>
							</div>
							<div class="center">
								<picture>
									<source srcset="images/fr-CA/ExampleAudioFileUsageLight.webp" media="(prefers-color-scheme:light)" width="402" height="89">
									<img src="images/fr-CA/ExampleAudioFileUsageDark.webp" width="402" height="89"
										alt="undefined"
									/>
								</picture>
							</div>
						</div>
					</details>
					<hr>
					<details x-data="{input: ''}" id="stratagems" open>
						<summary><block name="usage-stratagems-title"></block></summary>
						<block name="usage-stratagems">
						</block>
						<search x-cloak>
							<!-- TODO PicoCSS doesn't reverse the border radius on grouped elements when document is RTL. -->
							<template x-ref="search"><block name="search"></block></template>
							<fieldset role="search">
								<input type="search" list="category" :placeholder="$refs.search.textContent" :aria-label="$refs.search.textContent" x-model="input"/>
								<button class="outline" @click="input = ''" id="clear-button"><block name="search-clear"></block></button>
							</fieldset>
							<datalist id="category">
								<block name="search-categories"></block>
							</datalist>
						</search>
						<ul class="nobullets" id="list" x-data="tools" @click="bubbleCopy">
							<!-- TODO: Somehow move this code to a template, that can be reused by prebuild.js and here. -->
							<template x-fo="value in search()" :key="value.item.key">
								<li class="stratagems" :data-types="JSON.stringify(value.item.type)" :data-key="value.item.key" :data-display="value.item.displayName || ''" :data-code="JSON.stringify(value.item.code)">
									<button>
										<template x-if="value.item.icon">
											<span class="centerMarginVertical overlay">
												<img :src="value.item.icon" :alt="value.item.displayName || value.item.key + ' icon'" class="icon" width="50px" height="50px">
											</span>
										</template>
										<div class="stratagemArrows">
											<span class="stratagemName" x-text="value.item.displayName || value.item.key"></span>
											<div class="arrows">
												<template x-for="arrow in value.item.code">
													<span class="arrow"></span>
												</template>
											</div>
										</div>
									</button>
								</li>
							</template>
							<include src="./html/stratagems.html"></include>
						</ul>
						<!-- TODO: Get "Can't find results" text from locale -->
						<p x-data="tools" x-show="search()==''" x-text="'Cannot find any results for '+input" x-cloak></p>
						<!-- TODO These "buttons" really should be <button>s, not an <li>s with interactivity. But PicoCSS adds styles that I don't want, which I'd need to override. Just a lot of work. -->
						<ul class="nobullets" x-cloak x-data="tools" id="list">
							<template x-for="value in search()" :key="value.item.key">
								<li tabindex="0" aria-role="button" class="stratagem" :class="value.item.type.join(' ')" @click.throttle.6000ms="copyStratagem()" @keydown.enter.throttle.6000ms="copyStratagem()" :data-key='value.item.key'>
									<template x-if="value.item.icon">
										<span class="overlay">
											<img :src="value.item.icon" class="icon" loading="lazy" width="50px" height="50px" :alt='value.item.key + " icon"'>
										</span>
									</template>
									<code spellcheck="false" x-text='value.item.modelName || "" + (value.item.displayName || value.item.key)'></code>
								</li>
							</template>
						</ul>
					</details>
					<hr>
					<details>
							<summary><block name="usage-defaults-title"></block></summary>
							<div class="grid">
								<div>
									<block name="usage-defaults">
									</block>
								</div>
								<div>
									<h3><block name="usage-defaults-example-title"></block></h3>
									<pre><code id="optionsExample" class="language-toml" data-filename="options.toml" data-mime="application/toml" dir="ltr"
										><include src="exampleOptions.toml"></include></code></pre>
									<div class="justifyEnd">
										<a href='data:application/toml;base64,ZGVsYXkgPSAyNTAgIyBEZWZhdWx0IDE1MA0KaG9sZERlbGF5ID0gNTAgIyBEZWZhdWx0IDEwDQpzdGVhbVBhdGggPSAiRDpcXFN0ZWFtIiAjIERlZmF1bHQgIkM6XFByb2dyYW0gRmlsZXMgKHg4NilcU3RlYW0iDQp1cGRhdGVzID0gZmFsc2UgIyBEZWZhdWx0IGlzIHRydWUNCndhaXQgPSAxMDAwICMgRGVmYXVsdCAw'><button>
											<block name="usage-defaults-example-download"></block>
										</button></a>
									</div>
								</div>
							</div>
					</details>
				</section>
			</article>
		</main>
	</body>
</html>
